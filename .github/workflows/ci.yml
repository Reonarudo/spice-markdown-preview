name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run package
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - if: runner.os != 'Linux'
        run: npm run test:extension
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: spice-markdown-preview-${{ runner.os }}-vsix
          path: '*.vsix'
  # Rebuilds every vendored parser with the pinned tools and fails on any byte that differs from
  # what is committed. This runner's build is the reference: when it differs from a local build,
  # its artifact is what gets committed (see dev.md).
  grammars:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Ubuntu 24.04 packages GNU Bison 3.8.2 and GNU flex 2.6.4, the pinned versions.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison flex
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npm run grammars
        env:
          BISON: bison
          FLEX: flex
          EMCC: emcc
      # `add -N` makes a module the build wrote for the first time show up in the diff too.
      - run: git add -N grammar/generated vendor/parsers && git diff --exit-code -- grammar/generated vendor/parsers
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rebuilt-parsers
          path: |
            vendor/parsers
            build/grammars/**/*.c
            build/grammars/**/*.h
  # Advisory: parses real PSpice decks that cannot be committed — Xyce_Regression states no licence
  # (Redmine #1190) — with the vendored module at a pinned commit, and reports every structural
  # error (scripts/corpus.ts). A failure here never blocks a merge; it says the overlay has a gap.
  corpus:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch Netlists/XDM/PSPICE of Xyce_Regression at a pinned commit
        run: |
          git init -q "$RUNNER_TEMP/xyce-regression"
          cd "$RUNNER_TEMP/xyce-regression"
          git remote add origin https://github.com/Xyce/Xyce_Regression.git
          git sparse-checkout set --no-cone /Netlists/XDM/PSPICE/
          git fetch -q --depth 1 --filter=blob:none origin bbde402756cdf542627ff7ea0056db130fcb005b
          git checkout -q FETCH_HEAD
      - run: node --import tsx scripts/corpus.ts --dialect pspice --ext .pspice,.net,.lib --title .pspice "$RUNNER_TEMP/xyce-regression/Netlists/XDM/PSPICE"
  minimum-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:extension
        env:
          VSCODE_VERSION: 1.95.0
